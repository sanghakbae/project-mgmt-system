name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # Firebase 웹 config — 공개 식별자(번들에 노출되는 값)라 직접 기재. 인증(pms_users)·데이터(pms_projects) Firestore
          VITE_FIREBASE_API_KEY: 'AIzaSyDs0Y65ryB83wvGslHfKGaM3_77F9_vTi4'
          VITE_FIREBASE_AUTH_DOMAIN: 'project-mgmt-system-66288.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'project-mgmt-system-66288'
          VITE_FIREBASE_STORAGE_BUCKET: 'project-mgmt-system-66288.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '712644597733'
          VITE_FIREBASE_APP_ID: '1:712644597733:web:227edf949df6969294c10c'
          # 첨부 R2 Worker URL (Repo Variable로 설정. 미설정 시 dataURL 폴백)
          VITE_R2_WORKER_URL: ${{ vars.VITE_R2_WORKER_URL }}
          # Google Chat 웹훅(시크릿)
          VITE_GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.VITE_GOOGLE_CHAT_WEBHOOK_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
